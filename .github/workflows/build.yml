name: build

# Everything here needs a Mac: the C engine is cross-compiled for iOS, the
# Swift layers are compiled against the iOS SDK, and the XCFramework is assembled
# by xcodebuild. The engine tests are the interesting part on this runner,
# because they exercise the two faults fixed in
# Patches/openbst-clock-times.patch -- every one of which is silent, so they are
# invisible to a build that merely succeeds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned so a change upstream cannot silently alter what this workflow
  # measured. Bump deliberately, and re-run the engine tests, whose expected
  # sample counts are tied to it.
  OPENBST_COMMIT: a151e78f66009bc74367974d14476061f3552346

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Check out the engine at the pinned commit, and patch it
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Mudb0y/openbst "$RUNNER_TEMP/openbst"
          git -C "$RUNNER_TEMP/openbst" checkout --quiet "$OPENBST_COMMIT"
          # cd into the clone and use an absolute patch path: a relative one
          # would resolve inside the clone, and -C with -C would not help.
          cd "$RUNNER_TEMP/openbst"
          git apply "$GITHUB_WORKSPACE/Patches/openbst-clock-times.patch"
          git diff --quiet src/tokenise.c src/text.c \
            && { echo "::error::patch applied but the sources are unchanged"; exit 1; }
          echo "engine at $(git rev-parse --short HEAD), patched"

      - name: Engine regression tests (host, no Xcode)
        run: |
          set -euo pipefail
          # These fail on the unpatched engine, so they are the check that the
          # patch is doing what it claims. Run them before the long build.
          python3 iOSProject/engine_tests.py --upstream "$RUNNER_TEMP/openbst"

      - name: Confirm the tests are load-bearing
        run: |
          set -euo pipefail
          # Revert the patch and require the tests to FAIL. Without this, a
          # test that has quietly stopped exercising anything would keep
          # passing and nobody would know.
          cd "$RUNNER_TEMP/openbst"
          git apply --reverse "$GITHUB_WORKSPACE/Patches/openbst-clock-times.patch"
          if python3 "$GITHUB_WORKSPACE/iOSProject/engine_tests.py" --upstream "$RUNNER_TEMP/openbst" >/dev/null 2>&1; then
            echo "::error::engine tests pass on the UNPATCHED engine, so they are not testing the patch"
            exit 1
          fi
          echo "engine tests fail without the patch, as they should"
          git apply "$GITHUB_WORKSPACE/Patches/openbst-clock-times.patch"

      - name: Engine smoke test (every build produces samples)
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/iOSProject/smoke_test.py" --upstream "$RUNNER_TEMP/openbst"

      - name: Build the XCFramework
        working-directory: iOSProject
        run: |
          set -euo pipefail
          python3 build_frameworks.py --upstream "$RUNNER_TEMP/openbst"
          test -d Frameworks/OpenBST.xcframework

      - name: Swift tests
        run: |
          set -euo pipefail
          # These need no Xcode project: each is compiled together with the file
          # under test, so it cannot drift from what ships.
          # The generated tables are compiled with SSMLText because that is what
          # uses them: a table that stopped compiling is a failure here rather
          # than a surprise on a device.
          swiftc -parse-as-library \
            "$GITHUB_WORKSPACE/iOSProject/Shared/SSMLText.swift" \
            "$GITHUB_WORKSPACE/iOSProject/Shared/CLDRText.swift" \
            "$GITHUB_WORKSPACE/iOSProject/Shared/Pronunciations.swift" \
            "$GITHUB_WORKSPACE/iOSProject/Shared/UnitPlurals.swift" \
            "$GITHUB_WORKSPACE/iOSProject/Tests/SSMLTextTests.swift" \
            -o "$RUNNER_TEMP/ssmltests"
          "$RUNNER_TEMP/ssmltests"

          swiftc -parse-as-library \
            "$GITHUB_WORKSPACE/iOSProject/Shared/EngineParameters.swift" \
            "$GITHUB_WORKSPACE/iOSProject/Tests/EngineParameterTests.swift" \
            -o "$RUNNER_TEMP/paramtests"
          "$RUNNER_TEMP/paramtests"

          swiftc -parse-as-library \
            "$GITHUB_WORKSPACE/iOSProject/Shared/LanguageDetector.swift" \
            "$GITHUB_WORKSPACE/iOSProject/Tests/LanguageDetectorTests.swift" \
            -o "$RUNNER_TEMP/langtests"
          "$RUNNER_TEMP/langtests"

          swift "$GITHUB_WORKSPACE/iOSProject/Tests/VoiceIdentifierTests.swift"

          # The zip reader and its inflate. Self-contained: the vectors are raw
          # deflate streams pinned from zlib, so this needs no corpus files.
          swiftc -parse-as-library \
            "$GITHUB_WORKSPACE/iOSProject/Sources/Deflate.swift" \
            "$GITHUB_WORKSPACE/iOSProject/Sources/Zip.swift" \
            "$GITHUB_WORKSPACE/iOSProject/Tests/ZipArchiveTests.swift" \
            -o "$RUNNER_TEMP/ziptests"
          "$RUNNER_TEMP/ziptests"

      - name: The generated tables must match their source
        run: |
          set -euo pipefail
          # tools/dictionary.txt and the CLDR data are the source; the two Swift
          # tables are generated from them. Regenerating and finding a diff means
          # one was edited without the other, so the check-in is stale.
          python3 "$GITHUB_WORKSPACE/tools/build_tables.py" >/dev/null
          python3 "$GITHUB_WORKSPACE/tools/build_units.py" >/dev/null
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet -- \
                 iOSProject/Shared/CLDRText.swift \
                 iOSProject/Shared/Pronunciations.swift \
                 iOSProject/Shared/UnitPlurals.swift; then
            echo "::error::the generated tables are out of date; run tools/build_tables.py and tools/build_units.py"
            git -C "$GITHUB_WORKSPACE" --no-pager diff --stat -- \
                iOSProject/Shared/CLDRText.swift \
                iOSProject/Shared/Pronunciations.swift \
                iOSProject/Shared/UnitPlurals.swift
            exit 1
          fi
          echo "generated tables match their source"

      - name: Generate the Xcode project and build the app
        working-directory: iOSProject
        run: |
          set -euo pipefail
          brew install --quiet xcodegen
          xcodegen generate
          # Signing off: this checks that the app and its extension compile and
          # link against the XCFramework. Signing is a separate concern and
          # needs a certificate this runner does not have.
          xcodebuild build \
            -project iBestSpeech.xcodeproj \
            -scheme iBestSpeech \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload the XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: OpenBST-xcframework
          path: iOSProject/Frameworks/OpenBST.xcframework
          retention-days: 14
