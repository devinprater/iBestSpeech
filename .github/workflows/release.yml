name: release

# Cut a release: build the unsigned, re-signable .ipa on a Mac runner and attach
# it to a GitHub Release.
#
# The engine patch is applied here for the same reason it is in build.yml -- the
# faults this release is about are in the engine, so an .ipa built from an
# unpatched engine would ship the very faults it exists to fix.
#
# Two kinds of package come out of here, and the difference is voice data:
#
#   public   carries NO table data. The tables belong to Berkeley/HumanWare, so
#            they are left out and the user supplies their own Keynote Gold file,
#            which the app imports at run time. This is the kind that is
#            DISTRIBUTED -- it is what a Release attaches.
#   bundled  carries the tables, as every release up to v1.0.11 did. Built and
#            uploaded as a workflow artifact because the author installs it on his
#            own device, and NOT attached to a release: it is not ours to hand out.
#
# A `v*` tag builds both, publishes the PUBLIC one, and attaches it to the
# Release. workflow_dispatch builds both and uploads them as artifacts WITHOUT
# publishing anything, so a package can be inspected before it goes anywhere.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # Pinned so a release is reproducible and the expected sample counts in
  # engine_tests.py stay tied to what was actually shipped.
  OPENBST_COMMIT: a151e78f66009bc74367974d14476061f3552346

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check out the engine at the pinned commit, and patch it
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Mudb0y/openbst "$RUNNER_TEMP/openbst"
          git -C "$RUNNER_TEMP/openbst" checkout --quiet "$OPENBST_COMMIT"
          cd "$RUNNER_TEMP/openbst"
          git apply "$GITHUB_WORKSPACE/Patches/openbst-clock-times.patch"
          git diff --quiet src/tokenise.c src/text.c \
            && { echo "::error::patch applied but the sources are unchanged"; exit 1; }
          echo "engine at $(git rev-parse --short HEAD), patched"

      - name: Engine regression tests
        run: |
          set -euo pipefail
          # Never ship an .ipa whose engine has not been shown to read times.
          python3 "$GITHUB_WORKSPACE/iOSProject/engine_tests.py" \
            --upstream "$RUNNER_TEMP/openbst"

      - name: Import-path tests
        run: |
          set -euo pipefail
          # The identification layer runs on the host, against a table-free
          # engine, so a mistake in it is caught here rather than by a user whose
          # file the app refuses.
          python3 "$GITHUB_WORKSPACE/iOSProject/import_tests.py" \
            --upstream "$RUNNER_TEMP/openbst"

      - name: Packaging-spec tests
        run: |
          set -euo pipefail
          # make_sideload_ipa.py edits project.yml as TEXT (rename the project,
          # drop the App Group, repoint the XCFramework). A text edit that leaves
          # one reference behind produces a project that links one archive while
          # compiling against another's headers -- a failure a long way from its
          # cause. Checked here, with no Mac needed.
          python3 "$GITHUB_WORKSPACE/iOSProject/test_spec_edits.py"

      - name: Store-export and store-workflow tests
        run: |
          set -euo pipefail
          # The signed App Store build cannot be exercised here -- xcodebuild is
          # the whole point of it -- but its decisions can. These cover the
          # ExportOptions that make an upload succeed, the refusal to carry the
          # tables, and the flags the TestFlight workflow passes to asc (an
          # invented flag fails ten minutes into a run, after a full build).
          python3 "$GITHUB_WORKSPACE/iOSProject/test_store_export.py"
          python3 "$GITHUB_WORKSPACE/iOSProject/test_store_workflow.py"

      - name: Release-workflow tests
        run: |
          set -euo pipefail
          # The workflow is not compiled, so its mistakes surface as a red run
          # twenty minutes in. Check the checkable parts: every artifact it
          # uploads was built, every path a later step reads was written, and the
          # file it PUBLISHES is the table-free one.
          python3 "$GITHUB_WORKSPACE/iOSProject/test_release_workflow.py"

      - name: Build both XCFrameworks
        working-directory: iOSProject
        run: |
          set -euo pipefail
          python3 build_frameworks.py --upstream "$RUNNER_TEMP/openbst"
          test -d Frameworks/OpenBST.xcframework
          python3 build_frameworks.py --upstream "$RUNNER_TEMP/openbst" --no-tables
          test -d Frameworks/OpenBSTNoTables.xcframework

      - name: The two archives must differ by the tables and nothing else
        working-directory: iOSProject
        run: |
          set -euo pipefail
          # This is the property that makes a public build distributable, so it
          # is checked rather than assumed. The bundled archive must carry the
          # table modules; the public one must carry none of them, and neither
          # may be missing engine code.
          NM=""
          # Probe each candidate against a REAL archive, not /dev/null: no nm can
          # read /dev/null, so probing a dummy file rejects every candidate and
          # the step dies with "no nm on this runner" on a machine that has nm.
          # The list is ordered llvm-nm first because GNU nm cannot read Mach-O.
          WITH="Frameworks/OpenBST.xcframework/ios-arm64/libbst_device.a"
          WITHOUT="Frameworks/OpenBSTNoTables.xcframework/ios-arm64/libbst_device.a"
          for cand in llvm-nm nm /usr/bin/llvm-nm /usr/bin/nm; do
            if command -v "$cand" >/dev/null 2>&1 && "$cand" "$WITH" >/dev/null 2>&1; then
              NM="$cand"; break
            fi
          done
          test -n "$NM" || { echo "::error::no nm on this runner can read the archive"; exit 1; }
          echo "using $NM"

          n_with=$("$NM" "$WITH" 2>/dev/null | grep -c 'BST_DATA_' || true)
          n_without=$("$NM" "$WITHOUT" 2>/dev/null | grep -c 'BST_DATA_' || true)
          echo "table symbols -- bundled: $n_with, public: $n_without"
          test "$n_with" -ge 20 \
            || { echo "::error::the bundled archive is missing its table modules"; exit 1; }
          test "$n_without" -eq 0 \
            || { echo "::error::the public archive still carries table data"; exit 1; }

          # Symbol lists are materialised once, then matched with grep on a FILE.
          # Do not pipe `nm` into `grep -q`: grep exits at the first match, nm
          # dies of SIGPIPE, and under `set -o pipefail` the pipeline reports
          # success as failure. That made this step fail a build whose symbol was
          # present -- and only sometimes, which is worse.
          SYMS="$RUNNER_TEMP/bst-symbols.txt"
          "$NM" "$WITHOUT" 2>/dev/null > "$SYMS"

          # The file-import entry point must exist in the public archive, or the
          # app has no way to use the user's own file.
          for sym in bst_open_image bst_open_images bst_builds; do
            grep -qE "T _?${sym}\$" "$SYMS" \
              || { echo "::error::the public archive does not define $sym"; exit 1; }
            echo "public archive defines $sym"
          done

          sz_with=$(stat -f%z "$WITH")
          sz_without=$(stat -f%z "$WITHOUT")
          echo "archive sizes -- bundled: ${sz_with}, public: ${sz_without}"
          # The tables are megabytes. If the public archive is not a great deal
          # smaller, something is still in it.
          test "$sz_without" -lt "$((sz_with / 2))" \
            || { echo "::error::the public archive is not smaller than the bundled one"; exit 1; }
          echo "the public archive carries engine code and none of the tables"

      - name: Prepare the packaging tool and read the version
        working-directory: iOSProject
        run: |
          set -euo pipefail
          brew install --quiet xcodegen
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info/Info.plist)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the public .ipa (no table data)
        working-directory: iOSProject
        run: |
          set -euo pipefail
          # No flag for the default kind: table-free is what happens when nobody
          # asks for tables, so a forgotten flag cannot ship voice data.
          python3 make_sideload_ipa.py \
            --out "$RUNNER_TEMP/iBestSpeech-${VERSION}-public.ipa"

      - name: Build the bundled .ipa (author's own device only)
        working-directory: iOSProject
        run: |
          set -euo pipefail
          python3 make_sideload_ipa.py \
            --keep-tables \
            --out "$RUNNER_TEMP/iBestSpeech-${VERSION}-sideload.ipa"

      - name: Verify the bundled .ipa before it goes anywhere
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/iBestSpeech-${VERSION}-sideload.ipa"
          test -s "$IPA" || { echo "::error::no .ipa was produced"; exit 1; }

          # The property the whole artifact exists for: a sideloading tool can
          # only re-sign a binary that carries no signature and no profile of its
          # own. Re-checked here rather than trusting the build step.
          if unzip -l "$IPA" | grep -q 'embedded.mobileprovision'; then
            echo "::error::the .ipa carries a provisioning profile; it cannot be re-signed"
            exit 1
          fi
          if unzip -l "$IPA" | grep -q '_CodeSignature'; then
            echo "::error::the .ipa carries a code signature; it cannot be re-signed"
            exit 1
          fi

          # The provider extension is where the voices come from. An .ipa without
          # it installs and then has no voices at all.
          unzip -l "$IPA" | grep -q 'PlugIns/iBestSpeechProvider.appex/iBestSpeechProvider' \
            || { echo "::error::the provider extension is not embedded"; exit 1; }

          rm -rf "$RUNNER_TEMP/inspect" && mkdir -p "$RUNNER_TEMP/inspect"
          unzip -q "$IPA" -d "$RUNNER_TEMP/inspect"
          APP="$RUNNER_TEMP/inspect/Payload/iBestSpeech.app"
          BIN="$APP/iBestSpeech"
          EXT="$APP/PlugIns/iBestSpeechProvider.appex/iBestSpeechProvider"
          test -f "$BIN" || { echo "::error::the app binary is missing"; exit 1; }
          test -f "$EXT" || { echo "::error::the extension binary is missing"; exit 1; }

          for f in "$BIN" "$EXT"; do
            BASE=$(basename "$f")
            SIZE=$(stat -f%z "$f")

            # Real arm64 Mach-O. A simulator slice would install nowhere.
            otool -hv "$f" | grep -q 'ARM64' \
              || { echo "::error::$BASE is not an arm64 binary"; exit 1; }

            # Built for iOS, not for a simulator. otool has printed both a number
            # and a name here across versions, so accept either: platform 2 is
            # PLATFORM_IOS and 7 is the simulator.
            LC=$(otool -l "$f")
            if ! echo "$LC" | grep -A4 LC_BUILD_VERSION | grep -qiE 'platform +2\b|platform IOS\b'; then
              echo "::error::$BASE was not built for iOS, only for a simulator"
              echo "$LC" | grep -A4 LC_BUILD_VERSION
              exit 1
            fi

            # A shell of an app with no engine in it would still be a valid zip.
            # The engine's twenty table modules alone are about half a megabyte
            # each (src_data_2006ENG.o is 497 KB, src_data_1995.o 497 KB), and
            # the measured binaries are 4.1 MB. 2 MB sits well clear of a build
            # with no engine in it and well under a real one.
            test "$SIZE" -gt 2000000 \
              || { echo "::error::$BASE is only ${SIZE} bytes -- this bundle is missing its tables"; exit 1; }

            # Do NOT look for engine symbols or table names in the BINARY.
            # A Release build sets STRIP_INSTALLED_PRODUCT=YES: both were tried
            # here and both reported nothing for a perfectly good 4.1 MB build.
            # The engine is checked on the ARCHIVE, below, where its symbol
            # index survives.
            echo "$BASE: arm64 iOS, ${SIZE} bytes"
          done

          UNRESOLVED="$RUNNER_TEMP/unresolved.txt"
          : > "$UNRESOLVED"
          for f in "$BIN" "$EXT"; do
            otool -L "$f" | tail -n +2 | awk '{print $1}' \
              | grep -v '^/usr/lib/' \
              | grep -v '^/System/Library/' \
              | grep -v '^@rpath/' \
              | grep -v '^@executable_path/' \
              | grep -v '^@loader_path/' \
              | grep -v '^$' \
              | sed "s|^|$(basename "$f") -> |" >> "$UNRESOLVED" || true
          done
          if [ -s "$UNRESOLVED" ]; then
            echo "::error::binaries depend on libraries outside the system:"
            cat "$UNRESOLVED"
            exit 1
          fi

          echo "bundled version: $VERSION"
          echo "bundled ipa size: $(stat -f%z "$IPA") bytes"

          # An upload without an icon is rejected by App Store Connect with
          # ITMS-90022, twenty minutes into a delivery. The icon arrives as
          # Assets.car plus CFBundleIconName, both produced by compiling
          # Assets.xcassets, so check the product rather than the sources.
          test -f "$APP/Assets.car" \
            || { echo "::error::no Assets.car in the bundle -- the icon catalog did not compile"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print CFBundleIconName' "$APP/Info.plist" >/dev/null 2>&1 \
            || { echo "::error::CFBundleIconName is missing -- App Store Connect would reject this with ITMS-90022"; exit 1; }
          echo "app icon: Assets.car present, CFBundleIconName=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIconName' "$APP/Info.plist")"

      - name: Verify the public .ipa carries no table data
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/iBestSpeech-${VERSION}-public.ipa"
          test -s "$IPA" || { echo "::error::no public .ipa was produced"; exit 1; }

          unzip -l "$IPA" | grep -q 'embedded.mobileprovision' \
            && { echo "::error::the public .ipa is signed; it cannot be re-signed"; exit 1; }
          unzip -l "$IPA" | grep -q 'PlugIns/iBestSpeechProvider.appex/iBestSpeechProvider' \
            || { echo "::error::the provider extension is not embedded"; exit 1; }

          rm -rf "$RUNNER_TEMP/inspect-public" && mkdir -p "$RUNNER_TEMP/inspect-public"
          unzip -q "$IPA" -d "$RUNNER_TEMP/inspect-public"
          APP="$RUNNER_TEMP/inspect-public/Payload/iBestSpeech.app"

          # The bundled build is unpacked too, so each public binary can be
          # compared with its own counterpart. The two are the same code with the
          # tables added, so the difference IS the table data -- a measurement
          # rather than a guess at a magic number.
          rm -rf "$RUNNER_TEMP/inspect-bundled" && mkdir -p "$RUNNER_TEMP/inspect-bundled"
          unzip -q "$RUNNER_TEMP/iBestSpeech-${VERSION}-sideload.ipa" -d "$RUNNER_TEMP/inspect-bundled"
          BAPP="$RUNNER_TEMP/inspect-bundled/Payload/iBestSpeech.app"

          for rel in "iBestSpeech" \
                     "PlugIns/iBestSpeechProvider.appex/iBestSpeechProvider"; do
            f="$APP/$rel"
            b="$BAPP/$rel"
            BASE=$(basename "$rel")
            SIZE=$(stat -f%z "$f")
            BSIZE=$(stat -f%z "$b")
            otool -hv "$f" | grep -q 'ARM64' \
              || { echo "::error::$BASE is not an arm64 binary"; exit 1; }
            LC=$(otool -l "$f")
            echo "$LC" | grep -A4 LC_BUILD_VERSION | grep -qiE 'platform +2\b|platform IOS\b' \
              || { echo "::error::$BASE was not built for iOS"; exit 1; }
            # Far above an empty shell: a build with no engine in it would be a
            # few hundred KB at most.
            test "$SIZE" -gt 700000 \
              || { echo "::error::$BASE is only ${SIZE} bytes -- the engine is not in it"; exit 1; }
            # And well under half its bundled twin, since the tables are
            # megabytes of the bundled size.
            test "$SIZE" -lt "$((BSIZE / 2))" \
              || { echo "::error::$BASE is ${SIZE} bytes against a bundled ${BSIZE} -- too close to be table-free"; exit 1; }
            echo "public $BASE: arm64 iOS, ${SIZE} bytes (bundled ${BSIZE})"
          done

          BUNDLED=$(stat -f%z "$RUNNER_TEMP/iBestSpeech-${VERSION}-sideload.ipa")
          PUBLIC=$(stat -f%z "$IPA")
          echo "bundled ipa: $BUNDLED bytes, public ipa: $PUBLIC bytes"
          test "$PUBLIC" -lt "$BUNDLED" \
            || { echo "::error::the public .ipa is not smaller than the bundled one"; exit 1; }
          echo "public version: $VERSION, no table data"

      - name: Upload the bundled .ipa
        uses: actions/upload-artifact@v4
        with:
          name: iBestSpeech-${{ env.VERSION }}-sideload
          path: ${{ runner.temp }}/iBestSpeech-${{ env.VERSION }}-sideload.ipa
          retention-days: 30

      - name: Upload the public .ipa
        uses: actions/upload-artifact@v4
        with:
          name: iBestSpeech-${{ env.VERSION }}-public
          path: ${{ runner.temp }}/iBestSpeech-${{ env.VERSION }}-public.ipa
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The PUBLIC .ipa is what gets attached. It carries no voice data, so it
          # is the only one we are in a position to hand out; the bundled build
          # stays a workflow artifact for the author's own device.
          IPA="$RUNNER_TEMP/iBestSpeech-${VERSION}-public.ipa"
          NOTES="$GITHUB_WORKSPACE/ReleaseNotes/${GITHUB_REF_NAME}.md"
          bash "$GITHUB_WORKSPACE/tools/publish_release.sh" "$GITHUB_REF_NAME" "$IPA" "$NOTES"
